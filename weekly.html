document.querySelectorAll('.range-btn').forEach(b => {
  b.onclick = () => {
    document.querySelectorAll('.range-btn').forEach(x => x.classList.remove('on'));
    b.classList.add('on'); curRange = +b.dataset.r; apply();
  };
});
document.getElementById('q').addEventListener('input', e => { q = e.target.value.trim().toLowerCase(); page = 0; apply(); });
document.getElementById('sortSel').addEventListener('change', e => { sort = e.target.value; apply(); });
function apply() {
  filtered = DATA.filter(r => {
    if (curCat !== -1 && r[6] !== curCat) return false;
    if (curRange && r[2] < curRange) return false;
    if (q && !(r[0].toLowerCase().includes(q) || r[7].toLowerCase().includes(q) || r[8].toLowerCase().includes(q))) return false;
    return true;
  });
  if (sort === 'stars') filtered.sort((a, b) => b[2] - a[2]);
  else if (sort === 'starsA') filtered.sort((a, b) => a[2] - b[2]);
  else if (sort === 'forks') filtered.sort((a, b) => b[3] - a[3]);
  else filtered.sort((a, b) => b[4].localeCompare(a[4]));
  page = 0; render();
}
function fmt(n) { return n >= 1000000 ? (n/1000000).toFixed(1) + 'M' : n >= 10000 ? (n/1000).toFixed(0) + 'k' : n; }
function render() {
  const list = document.getElementById('list');
  const start = page * PAGE, end = Math.min(start + PAGE, filtered.length);
  document.getElementById('count').textContent = '匹配 ' + filtered.length + ' / 91 个项目';
  if (!filtered.length) { list.innerHTML = '<div class="empty">😕 没有匹配的项目，换个关键词试试</div>'; renderPager(); return; }
  let h = '';
  for (let i = start; i < end; i++) {
    const r = filtered[i];
    const [name, url, stars, forks, year, lang, ci, intro, desc, topics, tag] = r;
    const tagHtml = tag === 'new' ? '<span class="tag-new">🆕 本周新星</span>'
      : tag === 'active' ? '<span class="tag-active">🔥 活跃热门</span>'
      : '<span class="tag-new">🆕 新星</span><span class="tag-active">🔥 活跃</span>';
    h += '<div class="card fade-in"><div class="ctop">'
      + '<span class="rank">#' + (i + 1) + '</span>'
      + '<span class="cname"><a href="' + url + '" target="_blank">' + name + '</a></span>'
      + tagHtml
      + '<span class="ccat" style="background:' + COLORS[ci] + '22;color:' + COLORS[ci] + '">' + CATS[ci] + '</span>'
      + '<span class="clang">' + (lang || '—') + '</span>'
      + '<span class="cstar">★ ' + fmt(stars) + '</span>'
      + '<span class="cfork">⑂ ' + fmt(forks) + '</span>'
      + '<span class="cyear">📅 ' + year + '</span></div>'
      + '<div class="cintro">💡 ' + intro + '</div>'
      + '<div class="cdesc">' + desc + '</div>'
      + '<div class="ctopics">' + topics.map(t => '<span>' + t + '</span>').join('') + '</div></div>';
  }
  list.innerHTML = h; renderPager();
}
function renderPager() {
  const pager = document.getElementById('pager');
  const pages = Math.max(1, Math.ceil(filtered.length / PAGE));
  document.getElementById('pageInfo').textContent = '第 ' + (page + 1) + ' / ' + pages + ' 页 · ' + filtered.length + ' 条结果';
  const nums = [];
  for (let i = 0; i < pages; i++) if (i === 0 || i === pages - 1 || Math.abs(i - page) <= 2) nums.push(i);
  const uniq = [...new Set(nums)].sort((a, b) => a - b);
  let h = '<button class="pg" data-p="prev" ' + (page === 0 ? 'disabled' : '') + '>‹</button>';
  let last = -2;
  uniq.forEach(p => {
    if (p - last > 1) h += '<span class="pg-dots">···</span>';
    h += '<button class="pg ' + (p === page ? 'on' : '') + '" data-p="' + p + '">' + (p + 1) + '</button>';
    last = p;
  });
  h += '<button class="pg" data-p="next" ' + (page >= pages - 1 ? 'disabled' : '') + '>›</button>';
  pager.innerHTML = h;
  pager.querySelectorAll('.pg').forEach(btn => {
    btn.addEventListener('click', () => {
      const p = btn.dataset.p;
      const np = p === 'prev' ? page - 1 : p === 'next' ? page + 1 : +p;
      if (np < 0 || np >= pages || np === page) return;
      page = np; render(); window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  });
}
apply();
</script>
</body>
